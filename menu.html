<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu</title>
  <style>
    /* Your existing styles... */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('menufull.jpg');
      
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* Navigation Bar */
    nav {
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 1.1em;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #e07a5f;
    }

    /* Cart Badge */
    .cart-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      background-color: red;
      color: white;
      padding: 2px 6px;
      border-radius: 50%;
      font-size: 0.9em;
      display: none;
    }

    header {
      background-image: url('menufull.jpg'); 
     
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 60px 20px 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 3em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .menu-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
    }

    .menu-item {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 15px;
      margin: 15px;
      width: 300px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }

    .menu-item:nth-child(1) { animation-delay: 0.2s; }
    .menu-item:nth-child(2) { animation-delay: 0.4s; }
    .menu-item:nth-child(3) { animation-delay: 0.6s; }
    .menu-item:nth-child(4) { animation-delay: 0.8s; }
    .menu-item:nth-child(5) { animation-delay: 1.0s; }
    .menu-item:nth-child(6) { animation-delay: 1.2s; }
    .menu-item:nth-child(7) { animation-delay: 1.4s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .details {
      padding: 15px;
    }

    .details h3 {
      margin-top: 0;
      text-transform: capitalize;
      color: #bc6c25;
    }

    .details p {
      color: #444;
      font-size: 0.95em;
    }

    .add-to-cart {
      background-color: #e07a5f;
      color: white;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s;
    }

    .add-to-cart:hover {
      background-color: #f4a261;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="menu.html">Menu</a>
    <a href="reservation.html">Reservation</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">
      Cart <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </nav>

  <!-- Page Header -->
  <header>
    <h1>Menu</h1>
  </header>

  <!-- Menu Items -->
  <div class="menu-container">

    <div class="menu-item">
      <img src="naan.jpg" alt="Naan">
      <div class="details">
        <h3>Naan</h3>
        <p>Soft, fluffy Indian flatbread baked in a traditional tandoor.</p>
        <p><strong>Price: 80/-</strong></p>
        <button class="add-to-cart" data-name="Naan" data-price="80">Add to Cart</button>
      </div>
    </div>

    <div class="menu-item">
      <img src="panner butter masala.jpg" alt="Paneer Butter Masala">
      <div class="details">
        <h3>Paneer Butter Masala</h3>
        <p>Cottage cheese cubes in a rich, buttery tomato gravy.</p>
        <p><strong>Price: 90/-</strong></p>
        <button class="add-to-cart" data-name="Paneer Butter Masala" data-price="90">Add to Cart</button>
      </div>
    </div>

    <div class="menu-item">
      <img src="poori.jpg" alt="Poori">
      <div class="details">
        <h3>Poori</h3>
        <p>Deep-fried Indian bread served hot with masala curry.</p>
        <p><strong>Price: 50/-</strong></p>
        <button class="add-to-cart" data-name="Poori" data-price="50">Add to Cart</button>
      </div>
    </div>

    <!-- More menu items can be added similarly -->

  </div>

  <script>
    // Function to add items to the cart
    function addToCart(name, price) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      // Check if item already exists in the cart
      const existingItem = cart.find(item => item.name === name);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ name, price, quantity: 1 });
      }
      // Save cart to localStorage
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert(`${name} added to your cart!`);
    }

    // Function to update cart count
    function updateCartCount() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
      const cartBadge = document.getElementById('cart-badge');
      if (totalItems > 0) {
        cartBadge.style.display = 'inline-block';
        cartBadge.textContent = totalItems;
      } else {
        cartBadge.style.display = 'none';
      }
    }

    // Event listener for "Add to Cart" buttons
    document.querySelectorAll('.add-to-cart').forEach(button => {
      button.addEventListener('click', function() {
        const name = this.getAttribute('data-name');
        const price = parseFloat(this.getAttribute('data-price'));
        addToCart(name, price);
      });
    });

    // Update cart count on page load
    window.addEventListener('load', updateCartCount);
  </script>

</body>
</html>
