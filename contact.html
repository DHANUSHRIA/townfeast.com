<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - TownFeast</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-image: url('contact.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }

    nav {
      background-color: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      display: flex;
      justify-content: center;
      gap: 30px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f4a261;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      min-height: 100vh;
      padding: 60px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contact-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .contact-info, .contact-form {
      flex: 1 1 400px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3em;
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }

    .contact-info p {
      font-size: 1.1em;
      margin: 12px 0;
      color: #fff;
    }

    .contact-form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
      margin-bottom: 15px;
      font-size: 1em;
    }

    .contact-form button {
      padding: 12px 24px;
      background-color: #e76f51;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .contact-form button:hover {
      background-color: #d8574f;
    }

    iframe {
      width: 100%;
      height: 250px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }

    @media (max-width: 768px) {
      .contact-box {
        flex-direction: column;
        padding: 30px 20px;
      }

      h1 {
        font-size: 2.2em;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="menu.html">Menu</a>
    <a href="reservation.html">Reservation</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="overlay">
    <div class="contact-box">
      <h1>Contact Us</h1>

      <div class="contact-info">
        <p><strong>📍 Address:</strong> 123 Flavor Street, Culinary City, India</p>
        <p><strong>📞 Phone:</strong> +91 98765 43210</p>
        <p><strong>✉️ Email:</strong> townfeast@gmail.com</p>
        <p><strong>🕒 Hours:</strong> Mon–Sun: 11:00 AM – 11:00 PM</p>

        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.510141476269!2d106.70042317510968!3d10.771553059288594!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f1d18c5d8a9%3A0x7bb13e7688f230f4!2sGoogle%20Vietnam!5e0!3m2!1sen!2sus!4v1682445983301!5m2!1sen!2sus" 
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>

      <div class="contact-form">
        <form>
          <label for="name">Full Name</label>
          <input type="text" id="name" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" required>

          <label for="message">Your Message</label>
          <textarea id="message" rows="6" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
